<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form validation</title>
  </head>

  <body>
    <center>
      <h1>form validation</h1>

      <form>
        <!-- required and autofocus -->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required autofocus />
        <br /><br />

        <!-- type-email for getting email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br /><br />

        <!-- min and max (value > 18 and < 60) -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="60" required />
        <br /><br />

        <!-- type-date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required />
        <br /><br />

        <!-- use pattern="[0-9]{10}" to get 10 digit number -->
        <label for="mobile">Mobile Number:</label>
        <input
          type="text"
          id="mobile"
          name="mobile"
          placeholder="Enter phone number"
          pattern="[0-9]{10}"
          required
        />
        <br /><br />

        <!-- pincode - 6digit -->
        <label for="pin">Pin Code:</label>
        <input
          type="text"
          id="pin"
          name="pin"
          placeholder="Enter pin code"
          pattern="[0-9]{6}"
          required
        />
        <br /><br />

        <!-- password -->
        <label for="pass">password:</label>
        <input
          type="text"
          id="pass"
          name="pass"
          placeholder="Enter password"
          pattern="[0-9A-Za-z@]{5,}"
          required
        />
        <br /><br />

        <!--  -->
        <label for="volume">Volume:</label>
        <input type="range" id="volume" name="volume" min="0" max="100" step="20"/>
        <br /><br />

        <input type="submit" value="Register" />
      </form>
    </center>
  </body>
</html>
