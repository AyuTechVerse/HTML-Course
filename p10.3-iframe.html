<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe</title>
  </head>
  <body>
    <h1>creating a frame using iframe</h1>

    <!-- local file -->
    <iframe
      src="images\doges_bhai.jpg"
      frameborder="1"
      width="400"
      height="250"
      title="dog_img"
    ></iframe>
    <br />

    <!-- wikipedia website -->
    <iframe
      src="https://en.wikipedia.org/wiki/Taj_Mahal"
      frameborder="1"
      width="400"
      height="250"
      title="Taj_Mahal"
    ></iframe>
  </body>
</html>
