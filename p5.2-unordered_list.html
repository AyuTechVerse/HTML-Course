<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Unordered list</title>
</head>

<body>

	<h2> Unordered list of subject </h2>

	<ul>
		<li> html </li>
		<li> CSS </li>
		<li> JS </li>
		<li> Python </li>
		<li> IoT </li>
	</ul>


	<!-- type-square attribute -->
	<ul type="square" >
		<li> html </li>
		<li> CSS </li>
		<li> JS </li>
		<li> Python </li>
		<li> IoT </li>
	</ul>

	<!-- type-circle attribute -->
	<ul type="circle" >
		<li> html </li>
		<li> CSS </li>
		<li> JS </li>
		<li> Python </li>
		<li> IoT </li>
	</ul>



</body>
</html>
