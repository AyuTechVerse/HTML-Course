<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>colspan and rowspan</title>
</head>

<body>

	<center> <h1>Student's Result</h1> </center>

	<table 
		border="1" 
		cellpadding="10"
		cellspacing="5"
		width="400"
		align="center" 

		style="text-align: center; color: red; background: pink;" 	
	>

		<tr>
			<th rowspan="2">Name</th>
			<th colspan="2">Marks</th>
		</tr>

		<tr>
			<td>HTML</td>
			<td>CSS</td>
		</tr>

		<tr>
			<td>Rahul </td>
			<td>90</td>
			<td>78</td>
		</tr>

		<tr>
			<td>Krishna </td>
			<td>86</td>
			<td>98</td>
		</tr>
		
	</table>

</body>
</html>
