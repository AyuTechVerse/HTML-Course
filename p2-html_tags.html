<!DOCTYPE html>
<html>
<head>
	<title>Formatting Example</title>
</head>

<body>
												<!-- center tag -->
	<center>
		<h1>HTML Formatting & Basic Tags</h1>   <!-- level 1 heading tag --> 
 	</center>

 	<!-- Student information -->
	<div>										<!-- division/ section tag -->

		<h2>Student Details</h2>				<!-- 2nd level heading tag -->

		<p>Name: <b>Ayush</b></p>				<!-- paragraph & bold tag -->

		<p>Course: <i>O Level</i></p>			<!-- italic tag -->

		<p><u>Web Designing</u> is an important subject.</p>   <!-- underline tag -->

		<p>Old Fee: <s>₹1000</s></p>			<!-- strick-through tag (cros line on text) -->

		<p>
			HTML<br>							<!-- paragraph tag -->
			CSS<br>
			JavaScript
		</p>

	</div>

	<hr>										<!-- horizantal rule(partition line) tag -->

	<h2>Preformatted Information</h2>

	<pre>										<!-- preformated tag(preserves line & spaces) -->
Name    : Ayush
Course  : O Level
Subject : HTML
	</pre>

</body>
</html>
