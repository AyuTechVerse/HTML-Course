<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Attribute</title>
</head>
<body>

    <h1>Input Attribute</h1>

    <form action="">
        
        <!-- Name and Value attributes -->
        <label for="name">Name:</label> 
        <input type="text" name="name" id="name" value="Dhanno" >

        <input type="button" value="Click Me"> <br><br>

        <!-- placeholder -->
        <label for="add">Address:</label> 
        <input type="text"  id="add" placeholder="Enter Your Address" ><br><br>

        <!-- required -->
         <label for="adh">Adhar No.:</label>
         <input type="number" name="" id="adh" required> <br><br>
         
        <!-- checked -->
        Gender:
        <input type="radio" name="gender" value="male" checked> Male
        <input type="radio" name="gender" value="female"> Female <br><br>

        <!-- readonly -->
        <label for="cty">Country:</label>
        <input type="text" name="" id="cty" value="India" readonly> <br><br>

         
        <input type="submit" value="submit">

    </form>
    
</body>
</html>
