<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sandbox</title>
  </head>

  <body>
    <!-- allow-script -->
    <iframe
      src="/sandbox_folder/javaScript.html"
      width="600"
      height="300"
      sandbox="allow-scripts"
      title="JavaScript Example"
    ></iframe> <br>

    <!-- allow-top-navigation --> 
    <iframe
      src="/sandbox_folder/gallery.html"
      width="600"
      height="300"
      sandbox="allow-popups"
      title="Gallery"
    ></iframe>

  </body>
</html>
